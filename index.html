<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#116a64">
  <meta name="description" content="ASM gider ve hekimler arası hesaplaşma uygulaması">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>ASM Gider Takip</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 13.5c-.9 1.8-3.1 3.9-7.5 7-4.4-3.1-6.6-5.2-7.5-7A6.2 6.2 0 0 1 12 5.2a6.2 6.2 0 0 1 9.4 6.4"/><path d="M2.5 12h5l2-3.5 3 7 2.2-3.5h6.8"/></svg>
        </span>
        <div class="brand-copy">
          <strong>ASM Gider Takip</strong>
          <small>Hekimler arası gider yönetimi</small>
          <span id="cloud-status" class="cloud-status"><span class="cloud-dot"></span>Yerel pilot</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="account" class="secondary" type="button">Hesabım</button>
        <button id="install" class="secondary" type="button" hidden>Yükle</button>
      </div>
    </header>
    <nav id="nav" aria-label="Ana menü">
      <button type="button" data-page="home" class="active"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-7h6v7"/></svg></span><span class="nav-label">Özet</span></button>
      <button type="button" data-page="expenses"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span class="nav-label">Giderler</span></button>
      <button type="button" data-page="doctors"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 8h4M19 6v4M17 20h4"/></svg></span><span class="nav-label">Hekimler</span></button>
      <button type="button" data-page="settlement"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg></span><span class="nav-label">Hesaplaşma</span></button>
    </nav>
    <main id="app" aria-live="polite"></main>
    <footer class="app-footer">
      <p id="footer-note">Veriler yalnızca bu cihazda saklanır. Düzenli yedek alın.</p>
      <div class="developer-credit" aria-label="Geliştiren Dr. Furkan Aksoy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7z"/><path d="m19 16 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7z"/></svg>
        <span>Geliştiren <strong>Dr. Furkan Aksoy</strong></span>
      </div>
    </footer>
  </div>
  <script src="./cloud.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
