<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#116a64">
  <meta name="description" content="ASM gider ve hekimler arası hesaplaşma uygulaması">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>ASM Gider Takip</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="logo" aria-hidden="true">✚</span>
        <div class="brand-copy">
          <strong>ASM Gider Takip</strong>
          <small>Hekimler arası gider yönetimi</small>
          <span id="cloud-status" class="cloud-status"><span class="cloud-dot"></span>Yerel pilot</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="account" class="secondary" type="button">Hesabım</button>
        <button id="install" class="secondary" type="button" hidden>Yükle</button>
      </div>
    </header>
    <nav id="nav" aria-label="Ana menü">
      <button type="button" data-page="home" class="active">⌂ <span>Özet</span></button>
      <button type="button" data-page="expenses">▤ <span>Giderler</span></button>
      <button type="button" data-page="doctors">♙ <span>Hekimler</span></button>
      <button type="button" data-page="settlement">⇄ <span>Hesaplaşma</span></button>
    </nav>
    <main id="app" aria-live="polite"></main>
    <footer id="footer-note">Veriler yalnızca bu cihazda saklanır. Düzenli yedek alın.</footer>
  </div>
  <script src="./cloud.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
